apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: actionsconnectors.aws.hops.ops.com.ai
spec:
  scope: Namespaced
  group: aws.hops.ops.com.ai
  names:
    kind: ActionsConnector
    plural: actionsconnectors
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - accountId
            - github
            properties:
              accountId:
                type: string
                description: AWS Account ID where the OIDC provider and role will be created.
              providerConfigRef:
                type: object
                description: Reference to the AWS ProviderConfig.
                properties:
                  name:
                    type: string
                    description: Name of the ProviderConfig. Defaults to "default".
                    default: default
                  kind:
                    type: string
                    description: Kind of the ProviderConfig. Defaults to "ProviderConfig".
                    default: ProviderConfig
              managementPolicies:
                type: array
                description: Crossplane management policies propagated to managed resources. Defaults to ["*"].
                items:
                  type: string
                  enum:
                  - "*"
                  - Create
                  - Observe
                  - Update
                  - Delete
                  - LateInitialize
                default:
                - "*"
              labels:
                type: object
                description: Custom labels applied to all Kubernetes resources. Merged with default labels (hops.ops.com.ai/managed, hops.ops.com.ai/<kind>).
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              github:
                type: object
                description: GitHub configuration for OIDC trust.
                required:
                - owner
                properties:
                  owner:
                    type: string
                    description: GitHub organization or username (e.g., "myorg" or "myuser").
                  ownerId:
                    type: string
                    pattern: "^[0-9]+$"
                    description: Immutable GitHub owner ID. When set, the trust policy accepts both legacy and immutable subject formats.
                  repository:
                    type: string
                    description: Repository name or pattern. Use "*" for all repos. Defaults to "*".
                    default: "*"
                  repositoryId:
                    type: string
                    pattern: "^[0-9]+$"
                    description: Immutable GitHub repository ID. Required with ownerId when repository is not "*".
                  refPattern:
                    type: string
                    description: |
                      Single GitHub OIDC context pattern for the trust policy condition.
                      Use refPatterns when more than one context must be trusted. Ignored
                      when refPatterns is set.
                      Examples: "*", "pull_request", "ref:refs/heads/main", "environment:production".
                    default: "*"
                  refPatterns:
                    type: array
                    description: |
                      GitHub OIDC context patterns trusted by the role. When set, this
                      list takes precedence over refPattern. Use this to trust distinct
                      events without granting every repository context access.
                    minItems: 1
                    maxItems: 10
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                  thumbprints:
                    type: array
                    description: |
                      List of thumbprints for GitHub OIDC. Defaults to the current GitHub Actions OIDC thumbprint.
                      The default (6938fd4d98bab03faadb97b34396831e3780aea1) is the thumbprint for token.actions.githubusercontent.com.
                    items:
                      type: string
                    default:
                    - "6938fd4d98bab03faadb97b34396831e3780aea1"
                x-kubernetes-validations:
                - rule: "!has(self.repositoryId) || has(self.ownerId)"
                  message: repositoryId requires ownerId
                - rule: "!has(self.ownerId) || !has(self.repository) || self.repository == '*' || has(self.repositoryId)"
                  message: repositoryId is required with ownerId for a specific repository
              oidcProvider:
                type: object
                description: OIDC provider configuration for importing existing resources.
                properties:
                  externalName:
                    type: string
                    description: External name (ARN) of existing OIDC provider to import. Leave empty to create new.
              role:
                type: object
                description: IAM role configuration.
                properties:
                  name:
                    type: string
                    description: Name for the IAM role. Defaults to "hops-github-actions".
                    default: hops-github-actions
                  externalName:
                    type: string
                    description: External name of existing IAM role to import. Leave empty to create new.
                  permissionsBoundary:
                    type: string
                    description: ARN of the IAM permissions boundary to attach to the role.
                  maxSessionDuration:
                    type: integer
                    description: Maximum session duration (in seconds) for the IAM role. Defaults to 3600.
                    default: 3600
                    minimum: 3600
                    maximum: 43200
              policy:
                type: object
                description: IAM policy configuration.
                required:
                - arn
                properties:
                  arn:
                    type: string
                    description: ARN of the IAM policy to attach to the role.
                default:
                  arn: "arn:aws:iam::aws:policy/AdministratorAccess"
              policyAttachment:
                type: object
                description: Policy attachment configuration for importing existing resources.
                properties:
                  externalName:
                    type: string
                    description: External name of existing policy attachment to import. Format is "role-name/policy-arn".
              tags:
                type: object
                description: Custom tags applied to all AWS resources. Merged with default tags (hops.ops.com.ai/managed, hops.ops.com.ai/<kind>).
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              ready:
                type: boolean
                description: Whether all resources are ready.
              oidcProvider:
                type: object
                description: OIDC provider status.
                properties:
                  arn:
                    type: string
                    description: ARN of the OIDC provider.
                  url:
                    type: string
                    description: URL of the OIDC provider.
              role:
                type: object
                description: IAM role status.
                properties:
                  arn:
                    type: string
                    description: ARN of the IAM role.
                  name:
                    type: string
                    description: Name of the IAM role.
              trustPolicy:
                type: object
                description: Trust policy configuration.
                properties:
                  subject:
                    type: string
                    description: The legacy subject pattern used in the trust policy.
                  subjects:
                    type: array
                    description: All subject patterns used in the trust policy, including immutable variants when IDs are configured.
                    items:
                      type: string
